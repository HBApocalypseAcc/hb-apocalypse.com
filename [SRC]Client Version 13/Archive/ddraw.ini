; cnc-ddraw configuration for Helbreath Apocalypse
; This file is auto-generated by the Apocalypse Launcher
; Visit https://github.com/FunkyFr3sh/cnc-ddraw for more info

[ddraw]
; Windowed mode (false = fullscreen)
windowed=false

; Fullscreen mode
fullscreen=true

; Maintain aspect ratio (false = stretch to fill screen)
maintas=false

; Letterbox/pillarbox (false = stretch to fill)
boxing=false

; Anti-aliasing
antialiasing=on

; Renderer (auto, opengl, gdi, direct3d9)
renderer=auto

; VSync
vsync=on

; Window position (centered)
posX=-32000
posY=-32000

; Use 0 for game's internal resolution
width=0
height=0

; Window border in windowed mode
border=true

; Allow resizing
resizable=true

; Device mode
devmode=true

; Save settings on exit
savesettings=1
