# Configuración del Servidor de Login Helbreath Apocalypse
# Login Server Configuration

[Server]
# Nombre del servidor de login
ServerName=HB Apocalypse Login

# Puerto del servidor de login
ServerPort=2848

# IP del servidor (0.0.0.0 para todas las interfaces)
ServerIP=0.0.0.0

# Tiempo de timeout de conexión (segundos)
ConnectionTimeout=60

# Máximo de conexiones simultáneas
MaxConnections=1000

[GameServers]
# Lista de servidores de juego disponibles
# Formato: ServerID=Name|IP|Port|MaxPlayers

Server1=Apocalypse Main|127.0.0.1|1234|500

[Database]
# Configuración de base de datos
DBHost=localhost
DBPort=3306
DBName=helbreath_login
DBUser=hblogin
DBPassword=changeme

[Security]
# Seguridad
EnableEncryption=true
AllowMultipleLogins=false
BannedIPList=/opt/helbreath/config/banned_ips.txt

[Logging]
# Configuración de logs
LogLevel=INFO
LogPath=/opt/helbreath/logs
EnableAccessLog=true
