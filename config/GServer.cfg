# Configuración del Servidor de Juego Helbreath Apocalypse
# Game Server Configuration

[Server]
# Nombre del servidor
ServerName=Helbreath Apocalypse

# Puerto del servidor de juego
ServerPort=1234

# IP del servidor (0.0.0.0 para todas las interfaces)
ServerIP=0.0.0.0

# Máximo de jugadores simultáneos
MaxPlayers=500

# Nivel máximo de personaje
MaxLevel=180

[LoginServer]
# IP del servidor de login
LoginServerIP=127.0.0.1

# Puerto del servidor de login
LoginServerPort=2848

[Game]
# Configuración del juego
ExperienceRate=1.0
DropRate=1.0
GoldRate=1.0

# PvP habilitado
PvPEnabled=true

# Modo de juego
GameMode=Normal

[Database]
# Configuración de base de datos
# (Para ser configurado según la implementación)
DBHost=localhost
DBPort=3306
DBName=helbreath
DBUser=hbuser
DBPassword=changeme

[Paths]
# Rutas de archivos del servidor
DataPath=/opt/helbreath/data
LogPath=/opt/helbreath/logs
